<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنسان حيوان نبات - التصحيح الجماعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #0d1b2a; color: #ffffff; font-family: Tahoma, sans-serif; }
        .roulette-box { font-size: 3rem; font-weight: bold; color: #facc15; animation: pulse 0.2s infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3">

    <!-- شاشة اللوبي الدخول كضيف -->
    <div id="loginScreen" class="bg-slate-800 p-6 rounded-2xl w-full max-w-sm text-center">
        <h2 class="text-2xl font-bold mb-4 text-amber-400">🎮 إنسان حيوان نبات</h2>
        <button onclick="socket.emit('guest_login')" class="w-full bg-emerald-600 font-bold py-3 rounded-xl text-white">دخول سريع للعبة 🚀</button>
    </div>

    <!-- الشاشة الرئيسية -->
    <div id="lobbyScreen" class="hidden bg-slate-800 p-6 rounded-2xl w-full max-w-md text-center">
        <h3 class="text-xl font-bold text-amber-400 mb-6">ساحة اللعب الجماعية</h3>
        <button onclick="startMatch()" class="bg-amber-500 text-slate-900 font-extrabold text-3xl w-40 h-40 rounded-full shadow-2xl border-4 border-amber-300">لعب</button>
    </div>

    <!-- 1. شاشة الانتظار مع العداد الحقيقي (1/5 إلى 5/5) -->
    <div id="searchingScreen" class="hidden bg-slate-800 p-6 rounded-2xl w-full max-w-sm text-center">
        <div class="text-4xl mb-3">👥</div>
        <h3 class="text-lg font-bold text-amber-300 mb-2">جاري تجميع اللاعبين...</h3>
        <!-- العداد الحقيقي بالظهور رقم برقم -->
        <div id="queueCounter" class="text-3xl font-extrabold text-emerald-400 tracking-widest my-4">1 / 5</div>
        <button onclick="location.reload()" class="bg-rose-600 text-xs px-4 py-2 rounded-xl">إلغاء</button>
    </div>

    <!-- 2. حركة اختيار الحرف العشوائية (الروليت) -->
    <div id="rouletteScreen" class="hidden bg-slate-800 p-6 rounded-2xl w-full max-w-sm text-center">
        <h3 class="text-sm font-bold text-slate-400 mb-2">جاري اختيار الحرف عشوائياً...</h3>
        <div id="rouletteLetter" class="roulette-box my-6">أ</div>
    </div>

    <!-- 3. شاشة اللعب والـ 60 ثانية زر التسليم -->
    <div id="gameScreen" class="hidden bg-slate-900 p-4 rounded-2xl w-full max-w-2xl">
        <div class="flex justify-between items-center mb-3 text-xs border-b border-slate-700 pb-2">
            <span id="roundBadge" class="font-bold text-amber-400">الجولة 1 من 3</span>
            <span id="targetLetter" class="text-xl font-extrabold text-amber-300">الحرف: -</span>
            <span id="timerBadge" class="text-rose-400 font-bold">⏱️ 60 ثانية</span>
        </div>

        <div id="categoriesInputs" class="space-y-2 mb-4"></div>
        <button onclick="submitAnswers()" class="w-full bg-emerald-600 font-bold py-3 rounded-xl shadow-lg">تسليم الإجابات 🚀</button>
    </div>

    <!-- 4. شاشة التصحيح الجماعي المتبادل بين اللاعبين -->
    <div id="reviewScreen" class="hidden bg-slate-800 p-4 rounded-2xl w-full max-w-4xl text-center">
        <h3 class="text-lg font-bold text-amber-400 mb-2">📋 صحح إجابات منافسيك (اضغط صح أو خطأ)</h3>
        <p class="text-xs text-slate-400 mb-4">صحين = 10 نقاط | صح وخطأ = 5 نقاط | خطأين = 0</p>
        
        <div class="overflow-x-auto">
            <table class="w-full text-xs text-right border-collapse">
                <thead>
                    <tr class="bg-slate-900 text-amber-300 border-b border-slate-700">
                        <th class="p-2">اللاعب</th>
                        <th class="p-2">إنسان</th>
                        <th class="p-2">حيوان</th>
                        <th class="p-2">نبات</th>
                        <th class="p-2">جماد</th>
                        <th class="p-2">بلاد</th>
                    </tr>
                </thead>
                <tbody id="reviewTableBody"></tbody>
            </table>
        </div>

        <button onclick="finishReview()" class="w-full mt-4 bg-blue-600 font-bold py-3 rounded-xl text-white">اعتماد النتيجة والانتقال للجولة التالية ⏭️</button>
    </div>

    <script>
        const socket = io();
        let currentLetter = 'أ';
        let categories = [];

        socket.on('auth_success', () => {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.remove('hidden');
        });

        function startMatch() {
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('searchingScreen').classList.remove('hidden');
            socket.emit('start_matchmaking');
        }

        // تحديث العداد الحقيقي 1/5، 2/5...
        socket.on('queue_update', (data) => {
            document.getElementById('queueCounter').innerText = `${data.count} / ${data.max}`;
        });

        socket.on('match_started', () => {
            document.getElementById('searchingScreen').classList.add('hidden');
            document.getElementById('rouletteScreen').classList.remove('hidden');

            // تأثير الروليت للحرف العشوائي
            const letters = ['أ', 'ب', 'ت', 'ج', 'ح', 'خ', 'د', 'ر', 'س', 'ش', 'ص', 'ط', 'ع', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'];
            let count = 0;
            const interval = setInterval(() => {
                document.getElementById('rouletteLetter').innerText = letters[Math.floor(Math.random() * letters.length)];
                count++;
                if (count > 15) {
                    clearInterval(interval);
                }
            }, 100);
        });

        socket.on('start_round_data', (data) => {
            setTimeout(() => {
                document.getElementById('rouletteScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('targetLetter').innerText = `الحرف: ${data.letter}`;
                currentLetter = data.letter;
                categories = data.categories;

                const box = document.getElementById('categoriesInputs');
                box.innerHTML = '';
                data.categories.forEach(cat => {
                    box.innerHTML += `
                        <div class="flex items-center gap-2 bg-slate-800 p-2 rounded-xl">
                            <span class="w-16 font-bold text-xs text-amber-300">${cat}</span>
                            <input type="text" id="ans_${cat}" placeholder="بحرف ${data.letter}..." class="w-full bg-slate-900 p-2 rounded text-xs text-white">
                        </div>
                    `;
                });
            }, 1800);
        });

        function submitAnswers() {
            const ans = {};
            categories.forEach(cat => {
                ans[cat] = document.getElementById(`ans_${cat}`).value;
            });
            socket.emit('submit_answers', ans);
        }

        // فتح شاشة التصحيح الجماعي وتعبئة إجابات باقي اللاعبين
        socket.on('open_review_phase', (players) => {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('reviewScreen').classList.remove('hidden');

            const tbody = document.getElementById('reviewTableBody');
            tbody.innerHTML = '';

            players.forEach(p => {
                // لا يصحح اللاعب إجابات نفسه
                if (p.socketId !== socket.id) {
                    let row = `<tr class="border-b border-slate-700">
                        <td class="p-2 font-bold text-amber-400">${p.username}</td>`;

                    categories.forEach(cat => {
                        const word = p.answers[cat] || 'لا يوجد';
                        row += `
                            <td class="p-2">
                                <div class="text-xs mb-1">${word}</div>
                                <div class="flex gap-1 justify-center">
                                    <button onclick="vote('${p.socketId}', '${cat}', true, this)" class="bg-emerald-600 px-2 py-0.5 rounded text-white font-bold">✓</button>
                                    <button onclick="vote('${p.socketId}', '${cat}', false, this)" class="bg-rose-600 px-2 py-0.5 rounded text-white font-bold">✕</button>
                                </div>
                            </td>
                        `;
                    });
                    row += `</tr>`;
                    tbody.innerHTML += row;
                }
            });
        });

        function vote(targetSocketId, category, isApproved, btn) {
            socket.emit('vote_answer', { targetSocketId, category, isApproved });
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.add('opacity-40'));
            btn.classList.remove('opacity-40');
            btn.classList.add('ring-2', 'ring-white');
        }

        function finishReview() {
            socket.emit('finish_review_phase');
            alert('تم اعتماد التصحيح الجماعي بنجاح!');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة جوابك جوابهم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>body { background-color: #0f172a; color: #ffffff; font-family: Tahoma, sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- شاشة الدخول المباشر (بدون تسجيل تعقيدي) -->
    <div id="loginScreen" class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-center">
        <h2 class="text-2xl font-bold mb-2 text-amber-400">🔥 جوابك جوابهم</h2>
        <p class="text-xs text-slate-400 mb-4">اكتب اسمك واهجم مباشرة للعب!</p>
        <input type="text" id="usernameInput" placeholder="اكتب اسمك هنا..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mb-4 text-white text-center font-bold">
        <button onclick="directJoin()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-white shadow-lg">دخول للعبة 🚀</button>
    </div>

    <!-- شاشة اللوبي (Lobby) -->
    <div id="lobbyScreen" class="hidden bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl text-center">
        <h2 id="welcomeUser" class="text-xl font-bold mb-4 text-amber-400">مرحباً بك</h2>
        <div class="space-y-3 mb-4">
            <button onclick="createRoom()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-white shadow-lg">🏠 إنشاء غرفة جديدة (روم)</button>
            <button onclick="startSoloBot()" class="w-full bg-purple-600 hover:bg-purple-500 font-bold py-3 rounded-xl text-white shadow-lg">🤖 تحدي البوت (لعب فردي)</button>
        </div>
        <div class="border-t border-slate-700 pt-4 text-right">
            <label class="block text-sm font-medium mb-1">الانضمام إلى غرفة صديق:</label>
            <div class="flex gap-2">
                <input type="text" id="roomCodeInput" placeholder="كود الغرفة" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-white uppercase text-center font-bold tracking-widest">
                <button onclick="joinRoom()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2.5 rounded-xl font-bold text-white">انضمام</button>
            </div>
        </div>
    </div>

    <!-- شاشة الانتظار للروم -->
    <div id="roomScreen" class="hidden bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl text-center">
        <h3 class="text-xl font-bold mb-2 text-amber-400">🚪 غرفة الانتظار</h3>
        <p class="text-sm text-slate-300 mb-2">شارك كود الروم مع أصدقائك:</p>
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 font-mono text-2xl font-bold tracking-widest text-emerald-400 mb-4" id="displayRoomCode">-----</div>
        <ul id="playersList" class="bg-slate-900 p-3 rounded-xl space-y-1 text-sm mb-4 text-right"></ul>
        <button id="startGameBtn" onclick="startGame()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-white shadow-lg mb-2">بدء التحدي الآن 🚀</button>
        <button onclick="leaveToLobby()" class="w-full bg-rose-600 hover:bg-rose-500 font-bold py-2 rounded-xl text-white text-sm">خروج للوبي 🚪</button>
    </div>

    <!-- شاشة السؤال واللعب (مع فحص فوري وعلامة صح/خطأ وزر خروج) -->
    <div id="gameScreen" class="hidden bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-lg shadow-2xl text-center relative">
        <!-- زر الخروج من القيم -->
        <button onclick="leaveToLobby()" class="absolute top-4 left-4 bg-rose-600/80 hover:bg-rose-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">خروج 🚪</button>

        <span id="questionCounter" class="text-xs bg-slate-900 px-3 py-1 rounded-full text-slate-400">السؤال 1 / 3</span>
        <h3 id="questionTitle" class="text-xl font-bold my-4 text-amber-300">جاري تحميل السؤال...</h3>
        
        <div class="relative mb-4">
            <input type="text" id="answerInput" oninput="checkAnswerInstantly(this.value)" placeholder="اكتب إجابتك هنا..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white text-center text-lg focus:outline-none focus:border-amber-400">
            <!-- أيقونة الصح والخطأ الفورية -->
            <span id="instantFeedbackIcon" class="absolute left-3 top-3.5 text-xl font-bold"></span>
        </div>

        <div id="scoreFeedbackBox" class="text-sm font-bold text-emerald-400 min-h-[30px]"></div>
    </div>

    <script>
        const socket = io();

        function directJoin() {
            const username = document.getElementById('usernameInput').value;
            if(!username) return alert('الرجاء إدخال اسمك أولاً!');
            socket.emit('direct_join', username);
        }

        socket.on('join_success', (data) => {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.remove('hidden');
            document.getElementById('welcomeUser').innerText = `أهلاً بك، ${data.username}`;
        });

        function createRoom() { socket.emit('create_room'); }
        socket.on('room_created', (roomCode) => {
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('roomScreen').classList.remove('hidden');
            document.getElementById('displayRoomCode').innerText = roomCode;
            document.getElementById('startGameBtn').classList.remove('hidden');
        });

        function joinRoom() {
            const code = document.getElementById('roomCodeInput').value;
            if(!code) return alert('أدخل كود الغرفة!');
            socket.emit('join_room', code);
        }

        socket.on('error_message', (msg) => alert(msg));

        socket.on('update_room_players', (players) => {
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('roomScreen').classList.remove('hidden');
            const list = document.getElementById('playersList');
            list.innerHTML = '';
            players.forEach(p => {
                list.innerHTML += `<li class="text-slate-200">👤 ${p.username} (${p.score} نقطة)</li>`;
            });
        });

        function startGame() { socket.emit('start_game'); }
        function startSoloBot() { socket.emit('start_solo_bot'); }

        function leaveToLobby() {
            document.getElementById('roomScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.remove('hidden');
        }

        socket.on('new_question', (data) => {
            document.getElementById('roomScreen').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('questionCounter').innerText = `السؤال ${data.questionNum} من ${data.total}`;
            document.getElementById('questionTitle').innerText = data.question;
            document.getElementById('answerInput').value = '';
            document.getElementById('instantFeedbackIcon').innerText = '';
            document.getElementById('scoreFeedbackBox').innerText = '';
        });

        // فحص الإجابة فورياً أثناء الكتابة (مثل جوابك جوابهم)
        let typingTimer;
        function checkAnswerInstantly(val) {
            clearTimeout(typingTimer);
            const icon = document.getElementById('instantFeedbackIcon');
            if(!val.trim()) {
                icon.innerText = '';
                return;
            }
            typingTimer = setTimeout(() => {
                socket.emit('check_instant_answer', val);
            }, 300); // إرسال خفيف أثناء التوقف البسيط عن الكتابة
        }

        socket.on('answer_check_result', (res) => {
            const icon = document.getElementById('instantFeedbackIcon');
            const box = document.getElementById('scoreFeedbackBox');
            if(res.isCorrect) {
                icon.innerText = '✅';
                box.innerText = `إجابة صحيحة! (${res.text}) تطابق مع إجابات الجمهور وحصلت على +${res.points} نقطة`;
            } else {
                icon.innerText = '❌';
                box.innerText = 'إجابة غير موجودة ضمن الإجابات الشائعة';
            }
        });

        socket.on('game_over', (data) => {
            alert('انتهت التحديات! شكراً لمشاركتك في جوابك جوابهم.');
            leaveToLobby();
        });
    </script>
</body>
</html>
